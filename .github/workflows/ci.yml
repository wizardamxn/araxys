name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Cache MongoDB binary (for in-memory test DB)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  web:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy API to the phone
    needs: [api, web]
    # Only real pushes to main deploy; PRs just run the checks above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger deploy and wait for the result
        env:
          SECRET: ${{ secrets.DEPLOY_SECRET }}
          APP: araxys
          SHA: ${{ github.sha }}
          URL: https://deploy.amanahmad.xyz
        run: |
          # Every request is signed: HMAC-SHA256(secret, "<unix ts>.<message>")
          sig() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.*= //'; }
          ts=$(date +%s)
          res=$(curl -sS --fail-with-body -X POST "$URL/deploy/$APP" \
            -H "content-type: application/json" -H "x-deploy-timestamp: $ts" \
            -H "x-deploy-signature: $(sig "$ts.deploy.$APP.$SHA")" -d "{\"sha\":\"$SHA\"}")
          id=$(echo "$res" | jq -r .id)
          echo "Deploy $id queued on the phone"
          for _ in $(seq 1 150); do
            sleep 5
            ts=$(date +%s)
            st=$(curl -sS --fail-with-body "$URL/deploys/$id" -H "x-deploy-timestamp: $ts" \
              -H "x-deploy-signature: $(sig "$ts.status.$id")") || continue
            status=$(echo "$st" | jq -r .status)
            if [ "$status" = queued ] || [ "$status" = running ]; then continue; fi
            echo "$st" | jq -r .log
            [ "$status" = succeeded ] && exit 0 || exit 1
          done
          echo "Timed out waiting for the phone"; exit 1
